<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Твоё Имя — ссылки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 40px 20px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -1;
    background:
      radial-gradient(600px circle at 20% 15%, rgba(120, 80, 255, .28), transparent 60%),
      radial-gradient(600px circle at 80% 85%, rgba(0, 200, 255, .20), transparent 60%);
  }

  .card { width: 100%; max-width: 440px; text-align: center; padding-top: 20px; }

  /* контейнер аватарки: место зарезервировано всегда */
  .avatar {
    position: relative;
    width: 112px;
    height: 112px;
    margin: 0 auto;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.12);
    background: linear-gradient(135deg, rgba(120,80,255,.45), rgba(0,200,255,.35));
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* заглушка — первая буква имени */
  .avatar .placeholder {
    font-size: 42px;
    font-weight: 700;
    color: rgba(255,255,255,.85);
    user-select: none;
  }

  /* фото поверх заглушки, если загрузилось */
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .3s ease;
  }

  .avatar img.loaded { opacity: 1; }

  h1 { font-size: 24px; margin-top: 18px; letter-spacing: -.02em; }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 26px;
    padding: 5px;
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
  }

  .tab {
    padding: 11px 10px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #9a9aa8;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: color .18s, background .18s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab:hover { color: #fff; }

  .tab.active {
    color: #fff;
    background: rgba(255,255,255,.12);
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }

  .tab:focus-visible { outline: 2px solid rgba(255,255,255,.4); outline-offset: 2px; }

  .links { display: grid; gap: 12px; margin-top: 20px; }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s, border-color .18s;
    animation: rise .35s ease both;
  }

  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.22);
    outline: none;
  }

  .ico {
    position: relative;
    width: 24px; height: 24px;
    flex-shrink: 0;
  }

  .ico img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .ico .fb {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: -.02em;
  }

  .link .arrow { margin-left: auto; opacity: .3; transition: .18s; }
  .link:hover .arrow { opacity: 1; transform: translateX(3px); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .link { animation: none; }
    .tab, .link, .arrow, .avatar img { transition: none; }
  }

  @media (max-width: 380px) {
    .tab { font-size: 13px; padding: 10px 8px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="avatar">
    <span class="placeholder" id="avatarLetter">Т</span>
    <img src="avatar.jpg" alt="Аватар"
         onload="this.classList.add('loaded')"
         onerror="this.remove()">
  </div>
  <h1>MopKoBOhKa</h1>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="text"   role="tab">txt</button>
    <button class="tab"        data-tab="stream" role="tab">live</button>
  </div>

  <nav class="links" id="links"></nav>
</main>

<script>
  const data = {
    text: [
      { name: "Telegram", url: "https://t.me/username",             icon: "telegram", color: "26A5E4" },
      { name: "MAX",      url: "https://max.ru/username",           icon: "",         color: "3B82F6" },
      { name: "X",        url: "https://x.com/username",            icon: "x",        color: "ffffff" },
      { name: "VK",       url: "https://vk.com/username",           icon: "vk",       color: "0077FF" },
      { name: "Bluesky",  url: "https://bsky.app/profile/username", icon: "bluesky",  color: "0085FF" },
      { name: "Tumblr",   url: "https://tumblr.com/username",       icon: "tumblr",   color: "ffffff" },
      { name: "Mastodon", url: "https://mastodon.social/@username", icon: "mastodon", color: "6364FF" },
    ],
    stream: [
      { name: "Twitch",         url: "https://twitch.tv/username",           icon: "twitch",  color: "9146FF" },
      { name: "YouTube",        url: "https://youtube.com/@username",        icon: "youtube", color: "FF0000" },
      { name: "VK Live",        url: "https://vk.com/username",              icon: "vk",      color: "0077FF" },
      { name: "Kick",           url: "https://kick.com/username",            icon: "kick",    color: "53FC18" },
      { name: "GoodGame",       url: "https://goodgame.ru/channel/username", icon: "",        color: "4A90E2" },
      { name: "VK Видео",       url: "https://vk.com/username",              icon: "vk",      color: "0077FF" },
      { name: "RUTUBE",         url: "https://rutube.ru/channel/username",   icon: "rutube",  color: "ffffff" },
      { name: "Ливача",         url: "https://lava.top/username",            icon: "",        color: "FF5C5C" },
      { name: "WWWtv",          url: "https://wwwtv.stream/username",        icon: "",        color: "A78BFA" },
      { name: "Tach TV",        url: "https://tach.tv/username",             icon: "",        color: "F59E0B" },
      { name: "Prime",          url: "https://prime.example/username",       icon: "",        color: "22C55E" },
      { name: "VPZone.tv",      url: "https://vpzone.tv/username",           icon: "",        color: "06B6D4" },
      { name: "nekolive.co.uk", url: "https://nekolive.co.uk/username",      icon: "",        color: "F472B6" },
    ]
  };

  const linksEl = document.getElementById("links");
  const tabs = document.querySelectorAll(".tab");

  // первая буква имени — для заглушки аватара
  const nameEl = document.querySelector("h1");
  document.getElementById("avatarLetter").textContent =
    (nameEl.textContent.trim()[0] || "?").toUpperCase();

  function render(tab) {
    linksEl.innerHTML = data[tab].map((l, i) => {
      const letter = (l.name[0] || "?").toUpperCase();
      const fb = `<span class="fb" style="background:#${l.color}22;color:#${l.color}">${letter}</span>`;
      const img = l.icon
        ? `<img src="https://cdn.simpleicons.org/${l.icon}/${l.color}" alt="" loading="lazy"
               onload="this.previousElementSibling.style.display='none'"
               onerror="this.remove()">`
        : "";
      return `
        <a class="link" href="${l.url}" target="_blank" rel="noopener noreferrer"
           style="animation-delay:${i * 45}ms">
          <span class="ico">${fb}${img}</span>
          <span>${l.name}</span>
          <span class="arrow">→</span>
        </a>`;
    }).join("");
  }

  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    render(t.dataset.tab);
  }));

  render("text");
</script>

</body>
</html>
