<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: start center;
  padding: 40px 20px 60px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Inter, sans-serif;
  background: #0a0a0f;
  color: #fff;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  background:
    radial-gradient(
      600px circle at 20% 15%,
      rgba(120,80,255,.28),
      transparent 60%
    ),
    radial-gradient(
      600px circle at 80% 85%,
      rgba(0,200,255,.20),
      transparent 60%
    );
}

.card {
  width: 100%;
  max-width: 440px;
  text-align: center;
  padding-top: 20px;
}

/* АВАТАР */

.avatar {
  position: relative;
  width: 112px;
  height: 112px;
  margin: 0 auto;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.12);
  background: linear-gradient(
    135deg,
    rgba(120,80,255,.45),
    rgba(0,200,255,.35)
  );
  overflow: hidden;
  display: grid;
  place-items: center;
}

.avatar .placeholder {
  font-size: 42px;
  font-weight: 700;
  color: rgba(255,255,255,.85);
  user-select: none;
}

.avatar img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .3s ease;
}

.avatar img.loaded {
  opacity: 1;
}

h1 {
  font-size: 24px;
  margin-top: 18px;
  letter-spacing: -.02em;
}

/* ВКЛАДКИ */

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 26px;
  padding: 5px;
  border-radius: 14px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
}

.tab {
  padding: 11px 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #9a9aa8;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: color .18s, background .18s;
}

.tab:hover {
  color: #fff;
}

.tab.active {
  color: #fff;
  background: rgba(255,255,255,.12);
  box-shadow: 0 2px 10px rgba(0,0,0,.2);
}

.tab:focus-visible {
  outline: 2px solid rgba(255,255,255,.4);
  outline-offset: 2px;
}

/* СПИСОК ССЫЛОК */

.links {
  display: grid;
  gap: 12px;
  margin-top: 20px;
}

.link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 18px;
  min-height: 52px;
  border-radius: 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  backdrop-filter: blur(8px);
  transition:
    transform .18s ease,
    background .18s,
    border-color .18s;
  animation: rise .35s ease both;
}

.link:hover,
.link:focus-visible {
  transform: translateY(-2px);
  background: rgba(255,255,255,.09);
  border-color: rgba(255,255,255,.22);
  outline: none;
}

/* ИКОНКИ */

.ico {
  position: relative;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.ico img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.ico .fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: -.02em;
}

.link .arrow {
  margin-left: auto;
  opacity: .3;
  transition: .18s;
}

.link:hover .arrow {
  opacity: 1;
  transform: translateX(3px);
}

/* УГОЛ С DONATEALERTS И MEMEALERTS */

.corner-links {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.corner-links .link {
  padding: 6px 4px;
  min-height: auto;
  font-size: 14px;
  background: none;
  border: 0;
  backdrop-filter: none;
  color: rgba(255,255,255,.65);
  animation: none;
}

.corner-links .link:hover,
.corner-links .link:focus-visible {
  transform: none;
  background: none;
  border: 0;
  color: rgba(255,255,255,.95);
}

.corner-links .link .arrow {
  margin-left: 8px;
  opacity: .4;
}

.corner-links .link:hover .arrow {
  opacity: .8;
}

/* OBS OVERLAY */

.obs-overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  z-index: 9999;
  pointer-events: none;
  background: transparent;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .link {
    animation: none;
  }
  .tab, .link, .arrow, .avatar img {
    transition: none;
  }
}

@media (max-width: 380px) {
  .tab {
    font-size: 13px;
    padding: 10px 8px;
  }
  h1 {
    font-size: 21px;
  }
  .corner-links {
    left: 10px;
    bottom: 10px;
  }
  .corner-links .link {
    font-size: 13px;
  }
}
</style>
</head>

// ==========================================

const nameElement = document.getElementById("profileName");
const avatarImage = document.getElementById("avatarImage");
const avatarLetter = document.getElementById("avatarLetter");

nameElement.textContent = settings.name;

avatarLetter.textContent =

if (settings.avatar && settings.avatar !==
    "https://example.com/avatar.png") {

  avatarImage.onload = () => {
    avatarImage.classList.add("loaded");
  };

  avatarImage.onerror = () => {
    avatarImage.remove();
  };

  avatarImage.src = settings.avatar;

}


// ==========================================
// СОЗДАНИЕ ИКОНОК
// ==========================================

function createIcon(platform) {

  const container = document.createElement("span");
  container.className = "ico";

  const fallback = document.createElement("span");
  fallback.className = "fallback";

  fallback.textContent =
    platform.fallback || platform.name.substring(0, 2).toUpperCase();

  fallback.style.background =
    `#${platform.color}22`;

  fallback.style.color =
    `#${platform.color}`;

  container.appendChild(fallback);

  // Если есть логотип Simple Icons,
  // сначала пробуем получить его оттуда.

  if (platform.icon) {

    const img = document.createElement("img");

    img.alt = "";
    img.loading = "lazy";

    img.onload = () => {
      fallback.style.display = "none";
    };

    img.onerror = () => {

      // Если Simple Icons не сработал,
      // пробуем favicon официального сайта.

      if (platform.domain) {

        img.onerror = () => {
          img.remove();
          fallback.style.display = "grid";
        };

        img.src =
          `https://www.google.com/s2/favicons?domain=${encodeURIComponent(platform.domain)}&sz=64`;

      } else {

        img.remove();
        fallback.style.display = "grid";

      }

    };

    img.src =
      `https://cdn.simpleicons.org/${encodeURIComponent(platform.icon)}/${encodeURIComponent(platform.color)}`;

    container.appendChild(img);

  } else if (platform.domain) {

    // Если логотипа Simple Icons нет,
    // используем favicon сайта.

    const img = document.createElement("img");

    img.alt = "";
    img.loading = "lazy";

    img.onload = () => {
      fallback.style.display = "none";
    };

    img.onerror = () => {
      img.remove();
      fallback.style.display = "grid";
    };

    img.src =
      `https://www.google.com/s2/favicons?domain=${encodeURIComponent(platform.domain)}&sz=64`;

    container.appendChild(img);

  }

  return container;

}


// ==========================================
// ОТОБРАЖЕНИЕ КАНАЛОВ
// ==========================================

const linksElement = document.getElementById("links");
const cornerLinksElement = document.getElementById("cornerLinks");
const tabs = document.querySelectorAll(".tab");

function render(category) {

  linksElement.innerHTML = "";

  data[category].forEach((platform, index) => {

    const link = document.createElement("a");

    link.className = "link";
    link.href = platform.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.style.animationDelay = `${index * 45}ms`;

    // Иконка
    link.appendChild(createIcon(platform));

    // Название платформы
    const name = document.createElement("span");
    name.textContent = platform.name;

    link.appendChild(name);

    // Стрелка
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";

    link.appendChild(arrow);

    linksElement.appendChild(link);

  });

}


// ==========================================
// ОТОБРАЖЕНИЕ УГЛОВЫХ ССЫЛОК
// ==========================================

function renderCornerLinks() {

  cornerLinksElement.innerHTML = "";

  cornerPlatforms.forEach((platform) => {

    const link = document.createElement("a");

    link.className = "link";
    link.href = platform.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.appendChild(createIcon(platform));

    // Название
    const name = document.createElement("span");
    name.textContent = platform.name;

    link.appendChild(name);

    // Стрелка
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";

    link.appendChild(arrow);

    cornerLinksElement.appendChild(link);

  });

}


// ==========================================
// ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ==========================================

tabs.forEach(tab => {

  tab.addEventListener("click", () => {

    tabs.forEach(item => {

      item.classList.remove("active");
      item.setAttribute("aria-selected", "false");

    });

    tab.classList.add("active");
    tab.setAttribute("aria-selected", "true");

    render(tab.dataset.tab);

  });

});


// ==========================================
// ЗАПУСК
// ==========================================

render("text");
renderCornerLinks();

</script>
