<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Твоё Имя — ссылки</title>
<meta name="description" content="Все мои соцсети в одном месте">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow-x: hidden;
  }

  /* цветные пятна на фоне */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -1;
    background:
      radial-gradient(600px circle at 20% 15%, rgba(120, 80, 255, .28), transparent 60%),
      radial-gradient(600px circle at 80% 85%, rgba(0, 200, 255, .20), transparent 60%);
  }

  .card { width: 100%; max-width: 440px; text-align: center; }

  .avatar {
    width: 112px; height: 112px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
  }

  h1 { font-size: 24px; margin-top: 18px; letter-spacing: -.02em; }

  .bio {
    color: #9a9aa8;
    font-size: 15px;
    line-height: 1.5;
    margin-top: 8px;
    max-width: 320px;
    margin-inline: auto;
  }

  .links { display: grid; gap: 12px; margin-top: 30px; }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s, border-color .18s;
    animation: rise .5s ease both;
  }

  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.22);
    outline: none;
  }

  .link img { width: 22px; height: 22px; flex-shrink: 0; }
  .link .arrow { margin-left: auto; opacity: .3; transition: .18s; }
  .link:hover .arrow { opacity: 1; transform: translateX(3px); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .link { animation: none; }
  }
</style>
</head>
<body>

<main class="card">
  <img class="avatar" src="avatar.jpg" alt="Аватар">
  <h1>Твоё Имя</h1>
  <p class="bio">Пара слов о себе — чем занимаешься, что пилишь.</p>
  <nav class="links" id="links"></nav>
</main>

<script>
  // ✏️ РЕДАКТИРУЙ ТОЛЬКО ЭТО
  const links = [
    { name: "Telegram",  url: "https://t.me/username",           icon: "telegram",  color: "26A5E4" },
    { name: "Instagram", url: "https://instagram.com/username",  icon: "instagram", color: "E4405F" },
    { name: "VK",        url: "https://vk.com/username",         icon: "vk",        color: "0077FF" },
    { name: "YouTube",   url: "https://youtube.com/@username",   icon: "youtube",   color: "FF0000" },
    { name: "TikTok",    url: "https://tiktok.com/@username",    icon: "tiktok",    color: "ffffff" },
    { name: "GitHub",    url: "https://github.com/username",     icon: "github",    color: "ffffff" },
  ];

  document.getElementById("links").innerHTML = links.map((l, i) => `
    <a class="link" href="${l.url}" target="_blank" rel="noopener noreferrer"
       style="animation-delay:${i * 60}ms">
      <img src="https://cdn.simpleicons.org/${l.icon}/${l.color}" alt="" loading="lazy">
      <span>${l.name}</span>
      <span class="arrow">→</span>
    </a>
  `).join("");
</script>

</body>
</html>
